# deploy/nginx.conf
#
# Nginx reverse proxy configuration for KIRA API.
# Forwards public HTTP traffic to uvicorn running on localhost:8000.
#
# Copy to: /etc/nginx/sites-available/kira
# Enable:  sudo ln -s /etc/nginx/sites-available/kira /etc/nginx/sites-enabled/
# Test:    sudo nginx -t
# Reload:  sudo systemctl reload nginx

server {
    listen 80;
    server_name _;   # Replace _ with your domain if you have one

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Logging
    access_log /var/log/nginx/kira_access.log;
    error_log  /var/log/nginx/kira_error.log;

    # Proxy all requests to uvicorn
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Pass real client IP to FastAPI
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — pipeline can take 60+ seconds
        proxy_connect_timeout  10s;
        proxy_send_timeout     120s;
        proxy_read_timeout     120s;

        # Buffer settings
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      4 32k;
    }

    # Health check endpoint — used by load balancers
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;   # Don't clutter logs with health checks
    }
}

